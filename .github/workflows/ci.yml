name: Verify and preview

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest PR validation while never skipping a main-commit prerelease.
concurrency:
  group: piko-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts/ci
      - name: Lint Python syntax and high-confidence errors
        run: python -m ruff check --select E4,E7,E9 src tests scripts/ci
      - name: Exercise portable agent contracts
        run: python -m pytest -q

  windows-gui-smoke:
    name: Real WinForms desktop automation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install native Windows UIA bindings
        run: python -m pip install -e ".[windows,dev]"
      - name: Execute real foreground form automation
        shell: pwsh
        env:
          PIKO_GUI_SMOKE: '1'
        run: python -m pytest -q tests/windows/test_real_gui.py

  frontend:
    name: TypeScript and Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check TypeScript types
        run: npm run check
      - name: Bundle web frontend
        run: npm run build

  windows-installer:
    name: Build packaged Windows x64 installer
    runs-on: windows-latest
    needs: [python, frontend, python-dependency-audit, rust-dependency-audit, windows-gui-smoke]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Stamp unique monotonic installer version
        shell: pwsh
        run: python scripts/ci/version.py "${{ github.run_number }}"
      - name: Build bundled Python backend
        shell: pwsh
        run: ./scripts/ci/package-backend.ps1
      - name: Verify Rust dependency lock
        shell: pwsh
        run: cargo metadata --locked --no-deps --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml | Out-Null
      - name: Install locked JavaScript dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Check and compile Tauri + frontend + Python sidecar
        working-directory: apps/desktop
        run: npm run tauri build
      - name: Verify and name installer artefacts
        shell: pwsh
        run: ./scripts/ci/collect-installer.ps1 -Commit "${{ github.sha }}" -Build "${{ github.run_number }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: piko-installer-${{ github.sha }}
          path: |
            distribution/*.exe
            distribution/*.sha256
          if-no-files-found: error
          retention-days: 30

  rust-dependency-audit:
    name: Audit pinned Rust crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Run the RustSec scanner directly. The rustsec/audit-check action
      # tries to create GitHub Checks for advisory warnings; the workflow's
      # read-only token cannot do so, which previously blocked all prereleases
      # even when RustSec reported zero security vulnerabilities.
      - name: Install locked RustSec scanner
        run: cargo install --locked --version 0.23.0 cargo-audit
      - name: Audit exact released Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo audit --file apps/desktop/src-tauri/Cargo.lock

  python-dependency-audit:
    name: Audit pinned Windows Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install vulnerability scanner
        run: python -m pip install 'pip-audit>=2.7,<4'
      - name: Audit locked Python packages
        shell: bash
        run: |
          set -euo pipefail
          sed '/^-e /d' scripts/ci/backend-windows.lock > /tmp/piko-audit-requirements.txt
          python -m pip_audit -r /tmp/piko-audit-requirements.txt --no-deps --disable-pip --strict

  windows-installer-smoke:
    name: Install, launch and uninstall NSIS on Windows
    runs-on: windows-latest
    needs: [windows-installer]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: piko-installer-${{ github.sha }}
          path: distribution
      - name: Verify downloaded installer and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem -Path distribution -Filter '*setup.exe' -File)
          if ($exe.Count -ne 1) { throw 'Expected one downloaded installer' }
          $checksum = Get-Content -Raw "$($exe[0].FullName).sha256"
          $expected = ($checksum -split '\s+')[0].Trim().ToLowerInvariant()
          $actual = (Get-FileHash $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Downloaded installer checksum mismatch' }
      - name: Test packaged NSIS lifecycle and sidecar cleanup
        shell: pwsh
        run: ./scripts/ci/smoke-installer.ps1 -Commit "${{ github.sha }}"

  publish-preview:
    name: Publish verified prerelease
    runs-on: ubuntu-latest
    needs: [windows-installer, windows-installer-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: piko-installer-${{ github.sha }}
          path: distribution
      - name: Publish installer for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(distribution/*.exe)
          checksums=(distribution/*.sha256)
          if (( ${#installers[@]} != 1 || ${#checksums[@]} != 1 )); then
            echo 'Exactly one installer and SHA256 sidecar must exist.' >&2
            exit 1
          fi
          (cd distribution && sha256sum --check "$(basename "${checksums[0]}")")
          tag="preview-${SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${installers[0]}" "${checksums[0]}" --clobber
          else
            gh release create "$tag" "${installers[0]}" "${checksums[0]}" \
              --target "$SHA" --prerelease --latest=false \
              --title "Piko Preview ${SHA:0:12}" \
              --notes "Automated Windows x64 NSIS preview for commit $SHA. Includes the local Python agent backend. Experimental: no guarantee of end-to-end hardware validation; Ollama and compatible model are user-managed."
          fi
