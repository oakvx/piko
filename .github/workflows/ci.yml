name: Verify and preview

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts/ci
      - name: Lint Python syntax and high-confidence errors
        run: python -m ruff check --select E4,E7,E9 src tests scripts/ci
      - name: Exercise portable agent contracts
        run: python -m pytest -q

  frontend:
    name: TypeScript and Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A lockfile is pending first network-enabled npm resolution. Use npm ci after it is committed.
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Check TypeScript types
        run: npm run check
      - name: Bundle web frontend
        run: npm run build

  windows-installer:
    name: Build packaged Windows x64 installer
    runs-on: windows-latest
    needs: [python, frontend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stamp unique monotonic installer version
        shell: pwsh
        run: python scripts/ci/version.py "${{ github.run_number }}"
      - name: Build bundled Python backend
        shell: pwsh
        run: ./scripts/ci/package-backend.ps1
      - name: Install JavaScript dependencies
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Check and compile Tauri + frontend + Python sidecar
        working-directory: apps/desktop
        run: npm run tauri build
      - name: Verify and name installer artefacts
        shell: pwsh
        run: ./scripts/ci/collect-installer.ps1 -Commit "${{ github.sha }}" -Build "${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pico-installer-${{ github.sha }}
          path: |
            distribution/*.exe
            distribution/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish verified prerelease
    runs-on: ubuntu-latest
    needs: [windows-installer]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pico-installer-${{ github.sha }}
          path: distribution
      - name: Publish installer for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(distribution/*.exe)
          checksums=(distribution/*.sha256)
          if (( ${#installers[@]} != 1 || ${#checksums[@]} != 1 )); then
            echo 'Exactly one installer and SHA256 sidecar must exist.' >&2
            exit 1
          fi
          (cd distribution && sha256sum --check "$(basename "${checksums[0]}")")
          tag="preview-${SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${installers[0]}" "${checksums[0]}" --clobber
          else
            gh release create "$tag" "${installers[0]}" "${checksums[0]}" \
              --target "$SHA" --prerelease --latest=false \
              --title "Pico Preview ${SHA:0:12}" \
              --notes "Automated Windows x64 NSIS preview for commit $SHA. Includes the local Python agent backend. Experimental: no guarantee of end-to-end hardware validation; Ollama and compatible model are user-managed."
          fi
