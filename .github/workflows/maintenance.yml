name: Scheduled repository maintenance

on:
  # A weekly quality pulse; never produces synthetic commits or tags.
  schedule:
    - cron: '37 15 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: piko-weekly-maintenance
  cancel-in-progress: false

jobs:
  python:
    name: Python contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install portable test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check documentation links
        run: python scripts/ci/check_docs.py
      - name: Run portable regression suite
        run: python -m pytest -q

  frontend:
    name: Frontend types and dependency health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Restore locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run check
      - name: Scan production dependencies
        run: npm audit --omit=dev --audit-level=high

  supply-chain:
    name: Recheck reproducible dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Regenerate and verify the committed dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          output="$RUNNER_TEMP/piko-${sha}-sbom.cdx.json"
          python scripts/ci/generate_sbom.py --source-sha "$sha" --output "$output"
          python scripts/ci/generate_sbom.py --source-sha "$sha" --output "$output" --check
