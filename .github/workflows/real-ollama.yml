# Resource-intensive CPU inference test on hosted Windows: run for relevant main edits or manually.
# This proves real local Ollama inference on a Windows Server runner ONLY.
# It never substitutes for Win10/11 clean-VM or physical-input acceptance.
name: Real Ollama inference (Windows)

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/real-ollama.yml'
      - 'src/piko/ollama.py'
      - 'src/piko/setup.py'
      - 'src/piko/coach.py'
      - 'tests/test_onboarding_security.py'
      - 'tests/test_local_coach_setup.py'
      - 'tests/test_ollama_schema_recovery.py'
      - 'tests/real/test_ollama_inference.py'
      - 'tests/real/test_ollama_windows_agent.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-ollama-windows:
    name: Real local Ollama reasoning + vision / Windows runner
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_NO_CLOUD: '1'
      PIKO_REAL_OLLAMA: '1'
      PIKO_GUI_SMOKE: '1'
      PIKO_OLLAMA_REASONING_MODEL: 'qwen2.5:3b'
      PIKO_OLLAMA_VISION_MODEL: 'qwen3-vl:2b-instruct'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Piko real-test dependencies
        run: python -m pip install -e ".[windows,dev]"
      - name: Download and SHA256-verify pinned official Ollama Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $release = 'v0.40.11'
          $sha256 = 'bda4a493ba8a7c24d57263cd843cd68cee84f44aed4299eeed532acad7eda12a'
          $zip = Join-Path $env:RUNNER_TEMP 'ollama-windows-amd64.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'ollama-cli'
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/download/$release/ollama-windows-amd64.zip" -OutFile $zip -TimeoutSec 1200
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) { throw 'Ollama binary SHA256 mismatch; refusing to execute' }
          Expand-Archive -LiteralPath $zip -DestinationPath $folder -Force
          $binaries = @(Get-ChildItem -LiteralPath $folder -Filter 'ollama.exe' -File -Recurse)
          if ($binaries.Count -ne 1) { throw 'Expected one verified ollama.exe in the official archive' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PIKO_OLLAMA_BIN=$($binaries[0].FullName)"
      - name: Start real offline Ollama and verify local API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $process = Start-Process -FilePath $env:PIKO_OLLAMA_BIN -ArgumentList 'serve' -PassThru -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            if ($process.HasExited) { throw "Ollama serve exited with $($process.ExitCode)" }
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw 'Ollama local API did not start within 180 seconds' }
          Write-Host 'Ollama local loopback is responding; cloud inference disabled'
      - name: Download controlled local test models (no mocked outputs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PIKO_OLLAMA_BIN pull $env:PIKO_OLLAMA_REASONING_MODEL
          if ($LASTEXITCODE -ne 0) { throw 'Reasoning model download failed' }
          & $env:PIKO_OLLAMA_BIN pull $env:PIKO_OLLAMA_VISION_MODEL
          if ($LASTEXITCODE -ne 0) { throw 'Vision model download failed' }
      - name: Verify local first-run and Coach security on the actual Windows runner
        shell: pwsh
        run: |
          python -m pytest -q -ra tests/test_onboarding_security.py tests/test_local_coach_setup.py tests/test_window_selection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run REAL reasoning, vision and model-driven native Agent E2E
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path acceptance -Force | Out-Null
          python -m pytest -q -rs --junitxml=acceptance/real-ollama-windows.xml tests/real/test_ollama_inference.py tests/real/test_ollama_windows_agent.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect sanitized model-test evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path acceptance -Force | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $facts = [ordered]@{
            category = 'real Ollama / hosted Windows'
            target_windows_10_or_11_clean_vm = $false
            os_caption = $os.Caption
            os_build = $os.BuildNumber
            models = @($env:PIKO_OLLAMA_REASONING_MODEL, $env:PIKO_OLLAMA_VISION_MODEL)
            source_commit = '${{ github.sha }}'
            github_run_id = '${{ github.run_id }}'
            test_results_file = 'real-ollama-windows.xml'
            outcome = 'See JUnit; do not infer PASS from this metadata'
          }
          $facts | ConvertTo-Json -Depth 4 | Set-Content -Path acceptance/metadata.json -Encoding UTF8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: real-ollama-windows-${{ github.run_id }}
          path: acceptance/
          if-no-files-found: error
          retention-days: 30
