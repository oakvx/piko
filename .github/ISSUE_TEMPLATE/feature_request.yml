name: Feature request
description: Suggest one scoped, testable improvement.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Piko is Windows-first and local-first. Suggestions must retain explicit
        permission grants, plan approval, bounded observation and emergency stop.
  - type: textarea
    id: need
    attributes:
      label: User problem
      description: What is currently difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the observable user-facing result, not just the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include at least one success case and one safety/denial case.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs and dependencies
      description: Hardware, local model availability, privacy or resource requirements.
    validations:
      required: false
